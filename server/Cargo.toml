[package]
name = "voicy-server"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Control plane for a self-hosted Voicy server: invites, roles and LiveKit access tokens"

[dependencies]
anyhow = "1"
axum = "0.8"
base64 = "0.22"
jsonwebtoken = "9"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
