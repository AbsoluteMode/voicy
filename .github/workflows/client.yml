name: client

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/src-tauri
            server
      - name: Server checks
        working-directory: server
        run: cargo clippy -- -D warnings
      - name: Client checks
        working-directory: client/src-tauri
        run: |
          cargo clippy -- -D warnings
          cargo test
      - run: npm ci
        working-directory: client
      - uses: tauri-apps/tauri-action@v0
        with:
          projectPath: client
          # Draft release with the installer for version tags.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Voicy ${{ github.ref_name }}
          releaseDraft: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: voicy-setup
          path: client/src-tauri/target/release/bundle/nsis/*.exe
