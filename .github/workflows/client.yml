name: client

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: client/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client/src-tauri
            server
      - name: Server checks
        working-directory: server
        run: cargo clippy -- -D warnings
      - name: Client checks
        working-directory: client/src-tauri
        run: |
          cargo clippy -- -D warnings
          cargo test
      - name: Build installer
        working-directory: client
        shell: bash
        run: |
          npm ci
          npx tsc --noEmit
          npm run tauri build
          cp src-tauri/target/release/bundle/nsis/*-setup.exe Voicy-Setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: Voicy-Setup
          path: client/Voicy-Setup.exe
      # Invite pages link to releases/latest/download/Voicy-Setup.exe, so the
      # asset name must stay fixed.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$GITHUB_REF_NAME" client/Voicy-Setup.exe --clobber \
            || gh release create "$GITHUB_REF_NAME" client/Voicy-Setup.exe --title "Voicy $GITHUB_REF_NAME" --generate-notes
